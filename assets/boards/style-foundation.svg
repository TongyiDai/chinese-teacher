<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker></defs><text x="88" y="66" fill="#111111" font-size="32" font-weight="600">四种文风，共享一块地基</text><text x="88" y="98" fill="#666666" font-size="16">先让人看懂，再选择同事、咨询或更锋利的表达</text><line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8" stroke-width="1"/><rect x="430" y="410" width="340" height="78" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><line x1="430" y1="410" x2="770" y2="410" stroke="#2F6BFF" stroke-width="4"/><text x="600" y="447" text-anchor="middle" fill="#111111" font-size="22" font-weight="600">默认规则</text><text x="600" y="473" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">先让人看懂</text><path d="M500 410 C430 350 350 320 260 300" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><path d="M570 410 C540 350 500 320 460 300" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><path d="M630 410 C660 350 700 320 740 300" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><path d="M700 410 C770 350 850 320 940 300" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><rect x="160" y="225" width="180" height="70" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="250" y="260" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">同事风格</text><rect x="370" y="225" width="180" height="70" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="460" y="260" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">咨询风格</text><rect x="650" y="225" width="180" height="70" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="740" y="260" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">锋利表达</text><rect x="860" y="225" width="180" height="70" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1"/><text x="950" y="260" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">人味＋专业</text><circle cx="600" cy="410" r="6" fill="#2F6BFF"/><text x="600" y="558" text-anchor="middle" fill="#999999" font-size="14" font-weight="400">先统一判断，再改变语气</text></g></svg>
