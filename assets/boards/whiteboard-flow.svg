<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker></defs><text x="88" y="66" fill="#111111" font-size="32" font-weight="600">关键位置，放一张关键图</text><text x="88" y="98" fill="#666666" font-size="16">开头定调，章节解释，结尾收束</text><line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8" stroke-width="1"/><line x1="260" y1="220" x2="260" y2="510" stroke="#222222" stroke-width="1"/><line x1="244" y1="250" x2="276" y2="250" stroke="#B8B8B8" stroke-width="1"/><line x1="244" y1="365" x2="276" y2="365" stroke="#2F6BFF" stroke-width="2"/><line x1="244" y1="480" x2="276" y2="480" stroke="#B8B8B8" stroke-width="1"/><circle cx="260" cy="365" r="6" fill="#2F6BFF"/><text x="310" y="256" text-anchor="start" fill="#111111" font-size="20" font-weight="600">开头</text><text x="310" y="282" text-anchor="start" fill="#777777" font-size="13" font-weight="400">先定调</text><text x="310" y="371" text-anchor="start" fill="#111111" font-size="20" font-weight="600">关键章节</text><text x="310" y="397" text-anchor="start" fill="#2F6BFF" font-size="13" font-weight="400">解释框架或数据</text><text x="310" y="486" text-anchor="start" fill="#111111" font-size="20" font-weight="600">结尾</text><text x="310" y="512" text-anchor="start" fill="#777777" font-size="13" font-weight="400">收束行动</text><path d="M470 365 C570 280 660 280 750 325" fill="none" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M470 365 C570 450 660 450 750 405" fill="none" stroke="#B8B8B8" stroke-width="1"/><rect x="750" y="300" width="260" height="130" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><line x1="750" y1="300" x2="1010" y2="300" stroke="#2F6BFF" stroke-width="4"/><text x="880" y="355" text-anchor="middle" fill="#111111" font-size="22" font-weight="600">关键画板</text><text x="880" y="385" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">放在读者刚需要它的位置</text><text x="600" y="558" text-anchor="middle" fill="#999999" font-size="14" font-weight="400">画板跟着阅读需要出现</text></g></svg>
