name: CI
on:
  push: {branches: [master]}
  pull_request:
  workflow_dispatch:
jobs:
  readiness:
    name: Skill release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: git clone --depth 1 https://github.com/TongyiDai/skill-release-check.git .srcheck
      - run: python .srcheck/scripts/check_skill_readiness.py . --tracked-only
